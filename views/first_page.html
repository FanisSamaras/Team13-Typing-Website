<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1WEB3</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous">
    </script>
    <link rel="stylesheet" , href="/css/first_page.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap"
      rel="stylesheet">
    <script src="/js/main.js" type="module"></script>
  </head>
  <body>
    <nav class="container-fluid for width: 100%">
      <ul>
        <li><a href="/">Home</a></li>
        <li class="get_in">
          <a href="/leaderboards">LeaderBoards</a>
        </li>
        <li class="get_in"><a href="/login">Log in</a></li>
        <li><a href="/signup">Sign Up</a></li>
        <li id="batman">
          <a class="nav-link">produced by<br />team_13</a>
        </li>
      </ul>
    </nav>
    <header>
      <a>
        <h1>Faster</h1>
        <h2>.com</h2></a>
      </header>
      <div class="restart-wrapper">
        <button id="restartButton" class="btn btn-outline-light restart-button" type="button">Restart</button>
      </div>
      <section class="type_this d-flex justify-content-center">
            <div class="card w-50">
                <div class="card-body bg-dark" id="text">
                    Type everything you see
                </div>
            </div>
        </section>
            
        <section class="text-center">
                <input 
                    type="text" 
                    class="form-control w-50 mx-auto" 
                    placeholder="Start typing...Faster!">
        </section>
        <button 
            class="btn btn-secondary offcanvas-trigger" 
            type="button" 
            data-bs-toggle="offcanvas" 
            data-bs-target="#customPanel">
                Customize your Game
        </button>
        
        <div class="offcanvas offcanvas-end" 
             tabindex="-1" 
             id="customPanel"
             data-bs-theme="dark">
            <div class="offcanvas-header">
            <h5 class="offcanvas-title">
                Customize your Game</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        
        <div class="offcanvas-body" data-bs-theme="dark">
          <form data-bs-theme="dark">
            <fieldset>
              <legend>Select your options<br>to play your way!</legend>
                <br>
                <br>
                <br>
                <div class="mb-3">
                  <label for="languageSelect" 
                         class="form-label">Select your Language</label>
                  <select 
                    id="languageSelect" 
                    class="form-select">
                    <option value="" disabled hidden></option>
                    <option value="english" selected>English</option>
                    <option value="greek">Greek</option>
                  </select>
                </div>
                <br>
                <br>
                <div class="mb-3">
                  <label for="modeSelect" 
                         class="form-label">Select text type</label>
                  <select 
                    id="modeSelect" 
                    class="form-select">
                    <option value="" disabled hidden></option>
                    <option value="quotes">Quotes</option>
                    <option value="words" selected>Words</option>
                  </select>
                </div>
                <br>
                <br>
                <div class="mb-3">
                  <label for="difficultySelect" 
                         class="form-label">Select difficulty</label>
                  <select 
                    id="difficultySelect" 
                    class="form-select">
                    <option value="" disabled hidden></option>
                    <option value="noob">Noob</option>
                    <option value="intermediate" selected>Intermediate</option>
                    <option value="pro">Pro</option>
                  </select>
                </div>
                <br>
                <button type="submit" class="btn btn-primary">Start the Game!</button>
            </fieldset>

          </form>
        </div>
</div>

  </body>
</html>
